[package]
name = "doc2md-app"
version = "0.1.0"
description = "Batch convert HWP/HWPX/PDF/DOCX/XLSX/PPTX documents to Markdown"
edition = "2021"

[lib]
name = "doc2md_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
